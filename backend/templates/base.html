<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}동작 분석{% endblock %}</title>
</head>
<body>
<header>
  <a href="{% url 'analysis_list' %}">동작 분석</a>
  {% if user.is_authenticated %}
    <span>{{ user.username }}</span>
    <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button>로그아웃</button></form>
  {% else %}
    <a href="{% url 'login' %}">로그인</a>
    <a href="{% url 'signup' %}">회원가입</a>
  {% endif %}
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
